<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration Form</title>
</head>
<body>

    <h1>Patient Registration Form</h1>

    <p>Please fill in all required fields before submitting the form.</p>

    <form>

        Full Name:
        <input type="text" name="fullname"><br><br>

        Email Address:
        <input type="email" name="email"><br><br>

        Phone Number:
        <input type="tel" name="phone"><br><br>

        Date of Birth:
        <input type="date" name="dob"><br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        Services Required:<br>
        <input type="checkbox" name="service"> Consultation<br>
        <input type="checkbox" name="service"> Laboratory Test<br>
        <input type="checkbox" name="service"> Pharmacy
        <br><br>

        County of Residence:
        <select name="county">
            <option>Nairobi</option>
            <option>Kiambu</option>
            <option>Nakuru</option>
            <option>Mombasa</option>
        </select>
        <br><br>

        Additional Comments:<br>
        <textarea rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
